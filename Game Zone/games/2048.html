<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 - GameZone</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111827;
    color:white;
    text-align:center;
}

h1{
    color:#38bdf8;
    margin:20px;
}

.info{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
    font-size:18px;
    margin:15px;
}

#board{
    width:400px;
    max-width:94vw;
    height:400px;
    margin:20px auto;
    padding:10px;
    background:#334155;
    border-radius:12px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.tile{
    background:#475569;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    font-weight:bold;
}

button{
    padding:11px 18px;
    margin:5px;
    border:0;
    border-radius:8px;
    background:#38bdf8;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#7dd3fc;
}

#message{
    min-height:30px;
    font-size:19px;
}

.levels{
    max-width:600px;
    margin:20px auto;
}
</style>
</head>

<body>

<h1>🔢 2048</h1>

<div class="info">
    <div>Level: <b id="level">1</b></div>
    <div>Score: <b id="score">0</b></div>
    <div>Target: <b id="target">64</b></div>
</div>

<div id="board"></div>

<div id="message">
    Use Arrow Keys or buttons to move.
</div>

<div>
    <button onclick="restart()">🔄 Restart</button>
    <button onclick="goHome()">🏠 Home</button>
    <button id="nextBtn" onclick="nextLevel()" style="display:none">
        ▶ Next Level
    </button>
</div>

<div>
    <button onclick="move('up')">⬆️</button><br>
    <button onclick="move('left')">⬅️</button>
    <button onclick="move('down')">⬇️</button>
    <button onclick="move('right')">➡️</button>
</div>

<div class="levels">
    <h3>Levels</h3>
    <div id="levelButtons"></div>
</div>

<script>

let board=[];
let score=0;
let level=1;
let gameOver=false;

let unlockedLevel=
Number(localStorage.getItem("2048Unlocked"))||1;

const targets=[
    64,
    128,
    256,
    512,
    1024,
    2048,
    4096,
    8192,
    16384,
    32768
];

function startGame(){

    board=Array(16).fill(0);
    score=0;
    gameOver=false;

    document.getElementById("level").textContent=level;
    document.getElementById("score").textContent=score;
    document.getElementById("target").textContent=targets[level-1];

    document.getElementById("nextBtn").style.display="none";

    addRandom();
    addRandom();

    draw();

    document.getElementById("message").textContent=
    "Reach "+targets[level-1]+" to complete Level "+level;
}

function draw(){

    const container=document.getElementById("board");

    container.innerHTML="";

    board.forEach(value=>{

        const tile=document.createElement("div");

        tile.className="tile";

        tile.textContent=value===0?"":value;

        container.appendChild(tile);

    });
}

function addRandom(){

    const empty=[];

    board.forEach((v,i)=>{
        if(v===0) empty.push(i);
    });

    if(empty.length===0)return;

    const index=
    empty[Math.floor(Math.random()*empty.length)];

    board[index]=Math.random()<0.9?2:4;
}

function move(direction){

    if(gameOver)return;

    let old=board.join(",");

    if(direction==="left"){

        for(let r=0;r<4;r++){

            let row=board.slice(r*4,r*4+4);

            row=combine(row);

            for(let c=0;c<4;c++)
                board[r*4+c]=row[c];
        }
    }

    if(direction==="right"){

        for(let r=0;r<4;r++){

            let row=board.slice(r*4,r*4+4).reverse();

            row=combine(row).reverse();

            for(let c=0;c<4;c++)
                board[r*4+c]=row[c];
        }
    }

    if(direction==="up"){

        for(let c=0;c<4;c++){

            let col=[];

            for(let r=0;r<4;r++)
                col.push(board[r*4+c]);

            col=combine(col);

            for(let r=0;r<4;r++)
                board[r*4+c]=col[r];
        }
    }

    if(direction==="down"){

        for(let c=0;c<4;c++){

            let col=[];

            for(let r=0;r<4;r++)
                col.push(board[r*4+c]);

            col=combine(col.reverse()).reverse();

            for(let r=0;r<4;r++)
                board[r*4+c]=col[r];
        }
    }

    if(old!==board.join(",")){
        addRandom();
        draw();
        checkWin();
        checkGameOver();
    }
}

function combine(line){

    line=line.filter(x=>x!==0);

    let result=[];

    for(let i=0;i<line.length;i++){

        if(line[i]===line[i+1]){

            let value=line[i]*2;

            result.push(value);

            score+=value;

            i++;

        }else{

            result.push(line[i]);
        }
    }

    while(result.length<4)
        result.push(0);

    return result;
}

function checkWin(){

    const target=targets[level-1];

    if(board.includes(target)){

        gameOver=true;

        score+=100;

        document.getElementById("score").textContent=score;

        document.getElementById("message").textContent=
        "🏆 Level "+level+" Complete!";

        if(level<10){

            if(unlockedLevel<level+1){

                unlockedLevel=level+1;

                localStorage.setItem(
                    "2048Unlocked",
                    unlockedLevel
                );
            }

            document.getElementById("nextBtn")
            .style.display="inline-block";

        }else{

            document.getElementById("message").textContent=
            "🎉 Congratulations! All 10 levels completed!";
        }

        createLevels();
    }
}

function checkGameOver(){

    if(gameOver)return;

    for(let i=0;i<16;i++){

        if(board[i]===0)return;

    }

    for(let r=0;r<4;r++){

        for(let c=0;c<3;c++){

            if(board[r*4+c]===board[r*4+c+1])
                return;
        }
    }

    for(let c=0;c<4;c++){

        for(let r=0;r<3;r++){

            if(board[r*4+c]===board[(r+1)*4+c])
                return;
        }
    }

    gameOver=true;

    document.getElementById("message").textContent=
    "💥 Game Over! Restart and try again.";
}

document.addEventListener("keydown",e=>{

    if(e.key==="ArrowLeft")move("left");
    if(e.key==="ArrowRight")move("right");
    if(e.key==="ArrowUp")move("up");
    if(e.key==="ArrowDown")move("down");

});

function restart(){
    startGame();
}

function nextLevel(){

    if(level<10){

        level++;
        startGame();

    }
}

function createLevels(){

    const box=document.getElementById("levelButtons");

    box.innerHTML="";

    for(let i=1;i<=10;i++){

        let btn=document.createElement("button");

        btn.textContent=
        i<=unlockedLevel?"Level "+i:"🔒 "+i;

        btn.disabled=i>unlockedLevel;

        btn.onclick=()=>{
            level=i;
            startGame();
        };

        box.appendChild(btn);
    }
}

function goHome(){
    window.location.href="../index.html";
}

createLevels();
startGame();

</script>

</body>
</html>
