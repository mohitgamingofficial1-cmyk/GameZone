<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameZone - Snake</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #08080f;
            color: white;
            text-align: center;
        }

        .navbar {
            height: 70px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #0d0d15;
            border-bottom: 1px solid #292936;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .logo span {
            color: #8b5cf6;
        }

        .home-btn {
            text-decoration: none;
            color: white;
            background: #20202c;
            padding: 10px 18px;
            border-radius: 7px;
        }

        .game-page {
            padding: 35px 15px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 5px;
        }

        h1 span {
            color: #8b5cf6;
        }

        .subtitle {
            color: #858592;
        }

        .game-box {
            max-width: 650px;
            margin: 25px auto;
            background: #11111a;
            border: 1px solid #292936;
            border-radius: 15px;
            padding: 25px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat {
            background: #191923;
            border: 1px solid #292936;
            border-radius: 8px;
            padding: 10px 20px;
            min-width: 100px;
        }

        .stat p {
            margin: 0;
            color: #777785;
            font-size: 12px;
        }

        .stat h3 {
            margin: 4px 0 0;
            color: #9b7bff;
            font-size: 20px;
        }

        #gameCanvas {
            width: 500px;
            max-width: 100%;
            height: auto;
            background: #05050a;
            border: 2px solid #292936;
            border-radius: 8px;
        }

        .levels {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            margin: 20px 0;
        }

        .level {
            padding: 6px 9px;
            border-radius: 5px;
            border: 1px solid #33333f;
            color: #777785;
            font-size: 12px;
        }

        .level.active {
            background: #8b5cf6;
            color: white;
            border-color: #8b5cf6;
        }

        .level.completed {
            background: #263a2b;
            color: #8ee39d;
            border-color: #263a2b;
        }

        button {
            border: none;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }

        .start-btn {
            background: #8b5cf6;
            padding: 12px 22px;
            border-radius: 7px;
            margin-top: 15px;
        }

        .message {
            color: #858592;
            margin-top: 15px;
        }

        .instructions {
            color: #666673;
            font-size: 13px;
        }

        @media(max-width: 600px) {

            h1 {
                font-size: 32px;
            }

            .game-box {
                padding: 15px;
            }

            .stats {
                flex-wrap: wrap;
            }

            .stat {
                min-width: 80px;
                padding: 8px;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">

        <div class="logo">
            🎮 Game<span>Zone</span>
        </div>

        <a href="../index.html" class="home-btn">
            ← Home
        </a>

    </header>


    <main class="game-page">

        <h1>🐍 <span>Snake</span></h1>

        <p class="subtitle">
            Eat the food, grow your snake and complete all 10 levels.
        </p>


        <div class="game-box">

            <div class="stats">

                <div class="stat">
                    <p>SCORE</p>
                    <h3 id="score">0</h3>
                </div>

                <div class="stat">
                    <p>LEVEL</p>
                    <h3 id="level">1</h3>
                </div>

                <div class="stat">
                    <p>BEST</p>
                    <h3 id="best">0</h3>
                </div>

            </div>


            <div class="levels" id="levels"></div>


            <canvas
                id="gameCanvas"
                width="500"
                height="500">
            </canvas>


            <br>


            <button
                class="start-btn"
                onclick="startGame()">

                ▶ Start / Restart

            </button>


            <p
                class="message"
                id="message">

                Press Start to play.

            </p>


            <p class="instructions">

                Use ⬆️ ⬇️ ⬅️ ➡️ arrow keys to control the snake.

            </p>

        </div>

    </main>


<script>

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


const SIZE = 20;

const TOTAL_LEVELS = 10;


let snake = [];

let food = {};

let direction = "RIGHT";

let nextDirection = "RIGHT";

let score = 0;

let level = 1;

let gameTimer = null;

let gameRunning = false;


let bestScore =
    Number(localStorage.getItem("snakeBestScore")) || 0;


document.getElementById("best").textContent =
    bestScore;


/* =====================================
   CREATE 10 LEVEL BUTTONS
===================================== */

for (
    let i = 1;
    i <= TOTAL_LEVELS;
    i++
) {

    const levelElement =
        document.createElement("div");

    levelElement.className = "level";

    levelElement.id = "level-" + i;

    levelElement.textContent =
        "Level " + i;

    document
        .getElementById("levels")
        .appendChild(levelElement);
}


/* =====================================
   LEVEL SPEED
===================================== */

function getSpeed() {

    /*
        Level 1  = 150 ms
        Level 2  = 140 ms
        Level 3  = 130 ms
        ...
        Level 10 = 60 ms
    */

    return 150 - ((level - 1) * 10);
}


/* =====================================
   LEVEL TARGET
===================================== */

function getLevelTarget() {

    /*
        To complete:

        Level 1  → 3 points
        Level 2  → 6 points
        Level 3  → 9 points
        ...
        Level 10 → 30 points
    */

    return level * 3;
}


/* =====================================
   START GAME
===================================== */

function startGame() {

    clearInterval(gameTimer);


    snake = [

        {
            x: 240,
            y: 240
        },

        {
            x: 220,
            y: 240
        },

        {
            x: 200,
            y: 240
        }

    ];


    direction = "RIGHT";

    nextDirection = "RIGHT";

    score = 0;

    level = 1;

    gameRunning = true;


    updateStats();

    updateLevels();

    createFood();

    draw();


    document.getElementById("message").textContent =
        "Level 1 started! Target: 3 points.";


    startTimer();
}


/* =====================================
   START TIMER
===================================== */

function startTimer() {

    clearInterval(gameTimer);


    gameTimer = setInterval(

        gameLoop,

        getSpeed()

    );
}


/* =====================================
   CREATE FOOD
===================================== */

function createFood() {

    let validPosition = false;


    while (!validPosition) {

        food = {

            x:
                Math.floor(
                    Math.random() * 25
                ) * SIZE,

            y:
                Math.floor(
                    Math.random() * 25
                ) * SIZE

        };


        validPosition =
            !snake.some(

                part =>
                    part.x === food.x &&
                    part.y === food.y

            );

    }
}


/* =====================================
   GAME LOOP
===================================== */

function gameLoop() {

    direction =
        nextDirection;


    const head = {

        x: snake[0].x,

        y: snake[0].y

    };


    if (direction === "UP") {

        head.y -= SIZE;

    }

    if (direction === "DOWN") {

        head.y += SIZE;

    }

    if (direction === "LEFT") {

        head.x -= SIZE;

    }

    if (direction === "RIGHT") {

        head.x += SIZE;

    }


    /* WALL COLLISION */

    if (

        head.x < 0 ||

        head.x >= canvas.width ||

        head.y < 0 ||

        head.y >= canvas.height

    ) {

        gameOver();

        return;

    }


    /* BODY COLLISION */

    for (

        let i = 0;

        i < snake.length;

        i++

    ) {

        if (

            head.x === snake[i].x &&

            head.y === snake[i].y

        ) {

            gameOver();

            return;

        }

    }


    snake.unshift(head);


    /* FOOD */

    if (

        head.x === food.x &&

        head.y === food.y

    ) {

        score++;

        createFood();


        checkLevel();


    } else {

        snake.pop();

    }


    updateStats();

    draw();

}


/* =====================================
   CHECK LEVEL
===================================== */

function checkLevel() {

    const target =
        getLevelTarget();


    if (

        score >= target &&

        level < TOTAL_LEVELS

    ) {

        level++;


        document.getElementById("message").textContent =
            "🔥 Level " +
            level +
            " unlocked! Target: " +
            getLevelTarget() +
            " points.";


        updateLevels();


        startTimer();

    }


    if (

        level === TOTAL_LEVELS &&

        score >= getLevelTarget()

    ) {

        gameRunning = false;

        clearInterval(gameTimer);


        document.getElementById("message").textContent =
            "🏆 CONGRATULATIONS! You completed all 10 levels!";


        document
            .getElementById("level-10")
            .classList.add("completed");

    }

}


/* =====================================
   UPDATE LEVEL UI
===================================== */

function updateLevels() {

    for (

        let i = 1;

        i <= TOTAL_LEVELS;

        i++

    ) {

        const element =
            document.getElementById(
                "level-" + i
            );


        element.classList.remove("active");

        element.classList.remove("completed");


        if (i < level) {

            element.classList.add("completed");

        }


        if (i === level) {

            element.classList.add("active");

        }

    }

}


/* =====================================
   UPDATE SCORE
===================================== */

function updateStats() {

    document.getElementById("score")
        .textContent = score;


    document.getElementById("level")
        .textContent = level;


    if (score > bestScore) {

        bestScore = score;


        localStorage.setItem(
            "snakeBestScore",
            bestScore
        );


        document.getElementById("best")
            .textContent = bestScore;

    }

}


/* =====================================
   DRAW GAME
===================================== */

function draw() {

    /* BACKGROUND */

    ctx.fillStyle = "#05050a";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GRID */

    ctx.strokeStyle = "#11111a";

    for (

        let i = 0;

        i < 500;

        i += SIZE

    ) {

        ctx.beginPath();

        ctx.moveTo(i, 0);

        ctx.lineTo(i, 500);

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(0, i);

        ctx.lineTo(500, i);

        ctx.stroke();

    }


    /* FOOD */

    ctx.fillStyle = "#ff4d6d";

    ctx.beginPath();

    ctx.arc(

        food.x + 10,

        food.y + 10,

        8,

        0,

        Math.PI * 2

    );

    ctx.fill();


    /* SNAKE */

    snake.forEach(

        (part, index) => {

            ctx.fillStyle =
                index === 0
                    ? "#b49aff"
                    : "#7047c7";


            ctx.fillRect(

                part.x + 1,

                part.y + 1,

                18,

                18

            );

        }

    );

}


/* =====================================
   GAME OVER
===================================== */

function gameOver() {

    gameRunning = false;

    clearInterval(gameTimer);


    document.getElementById("message").textContent =
        "💥 Game Over! Your score: " +
        score +
        ". Press Restart to play again.";

}


/* =====================================
   KEYBOARD CONTROLS
===================================== */

document.addEventListener(

    "keydown",

    function(event) {


        if (

            event.key === "ArrowUp" &&

            direction !== "DOWN"

        ) {

            nextDirection = "UP";

        }


        if (

            event.key === "ArrowDown" &&

            direction !== "UP"

        ) {

            nextDirection = "DOWN";

        }


        if (

            event.key === "ArrowLeft" &&

            direction !== "RIGHT"

        ) {

            nextDirection = "LEFT";

        }


        if (

            event.key === "ArrowRight" &&

            direction !== "LEFT"

        ) {

            nextDirection = "RIGHT";

        }

    }

);


/* Initial screen */

snake = [

    {
        x: 240,
        y: 240
    },

    {
        x: 220,
        y: 240
    }

];

createFood();

draw();

updateLevels();

</script>

</body>
</html>
