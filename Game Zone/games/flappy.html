<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flappy - GameZone</title>

<style>
body{
    margin:0;
    background:#111827;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    color:#38bdf8;
}

#game{
    width:400px;
    height:600px;
    max-width:95%;
    margin:auto;
    position:relative;
    overflow:hidden;
    background:#7dd3fc;
    border:3px solid #38bdf8;
    border-radius:10px;
}

#bird{
    position:absolute;
    width:32px;
    height:25px;
    background:#facc15;
    border-radius:50%;
    left:80px;
    top:280px;
}

.pipe{
    position:absolute;
    width:60px;
    background:#22c55e;
}

.info{
    display:flex;
    justify-content:center;
    gap:25px;
    margin:15px;
}

button{
    padding:10px 18px;
    margin:5px;
    border:0;
    border-radius:8px;
    background:#38bdf8;
    font-weight:bold;
    cursor:pointer;
}

#message{
    min-height:30px;
    font-size:19px;
}
</style>
</head>

<body>

<h1>🐦 Flappy</h1>

<div class="info">
    <div>Level: <b id="level">1</b></div>
    <div>Score: <b id="score">0</b></div>
    <div>Target: <b id="target">5</b></div>
</div>

<div id="game">
    <div id="bird"></div>
</div>

<div id="message">
    Press SPACE or click the game to fly!
</div>

<button onclick="restart()">🔄 Restart</button>
<button onclick="goHome()">🏠 Home</button>

<button
    id="nextBtn"
    onclick="nextLevel()"
    style="display:none"
>
▶ Next Level
</button>

<script>

const game=document.getElementById("game");
const bird=document.getElementById("bird");

let level=1;
let score=0;
let birdY=280;
let velocity=0;
let pipes=[];
let running=true;
let frame=0;

const settings=[
    {speed:2.5,target:5,gap:170},
    {speed:2.8,target:7,gap:165},
    {speed:3,target:9,gap:160},
    {speed:3.2,target:11,gap:155},
    {speed:3.5,target:13,gap:150},
    {speed:3.8,target:15,gap:145},
    {speed:4,target:17,gap:140},
    {speed:4.3,target:19,gap:135},
    {speed:4.6,target:21,gap:130},
    {speed:5,target:25,gap:125}
];

function flap(){

    if(!running)return;

    velocity=-7;
}

document.addEventListener("keydown",e=>{

    if(e.code==="Space"){

        e.preventDefault();

        flap();
    }

});

game.addEventListener("click",flap);

function start(){

    pipes.forEach(p=>{
        p.top.remove();
        p.bottom.remove();
    });

    pipes=[];

    score=0;
    birdY=280;
    velocity=0;
    frame=0;
    running=true;

    document.getElementById("level").textContent=level;
    document.getElementById("score").textContent=score;
    document.getElementById("target").textContent=
    settings[level-1].target;

    document.getElementById("nextBtn")
    .style.display="none";

    document.getElementById("message").textContent=
    "Press SPACE or click to fly!";

    requestAnimationFrame(loop);
}

function createPipe(){

    const setting=settings[level-1];

    const gap=setting.gap;

    const gapTop=
    Math.floor(
        Math.random()*(400-gap-80)
    )+40;

    const top=document.createElement("div");
    const bottom=document.createElement("div");

    top.className="pipe";
    bottom.className="pipe";

    top.style.height=gapTop+"px";
    top.style.top="0px";
    top.style.left="400px";

    bottom.style.height=
    (600-gapTop-gap)+"px";

    bottom.style.bottom="0px";
    bottom.style.left="400px";

    game.appendChild(top);
    game.appendChild(bottom);

    pipes.push({
        top:top,
        bottom:bottom,
        x:400,
        gapTop:gapTop,
        passed:false
    });
}

function loop(){

    if(!running)return;

    frame++;

    velocity+=0.35;

    birdY+=velocity;

    bird.style.top=birdY+"px";

    if(frame%110===0){
        createPipe();
    }

    const speed=settings[level-1].speed;

    pipes.forEach(pipe=>{

        pipe.x-=speed;

        pipe.top.style.left=
        pipe.x+"px";

        pipe.bottom.style.left=
        pipe.x+"px";

        if(
            !pipe.passed &&
            pipe.x+60<80
        ){

            pipe.passed=true;

            score++;

            document.getElementById("score")
            .textContent=score;

            if(
                score>=settings[level-1].target
            ){

                completeLevel();

            }
        }

        if(collision(pipe)){

            gameOver();

        }

    });

    pipes=pipes.filter(pipe=>{

        if(pipe.x<-70){

            pipe.top.remove();
            pipe.bottom.remove();

            return false;
        }

        return true;
    });

    if(birdY<0||birdY>575){

        gameOver();

    }

    requestAnimationFrame(loop);
}

function collision(pipe){

    const birdLeft=80;
    const birdRight=112;

    const birdTop=birdY;
    const birdBottom=birdY+25;

    const pipeLeft=pipe.x;
    const pipeRight=pipe.x+60;

    if(
        birdRight>pipeLeft &&
        birdLeft<pipeRight
    ){

        if(
            birdTop<pipe.gapTop ||
            birdBottom>
            pipe.gapTop+
            settings[level-1].gap
        ){

            return true;
        }
    }

    return false;
}

function completeLevel(){

    if(!running)return;

    running=false;

    document.getElementById("message").textContent=
    "🏆 Level "+level+" Complete!";

    if(level<10){

        document.getElementById("nextBtn")
        .style.display="inline-block";

    }else{

        document.getElementById("message").textContent=
        "🎉 You completed all 10 levels!";
    }
}

function gameOver(){

    if(!running)return;

    running=false;

    document.getElementById("message").textContent=
    "💥 Game Over! Click Restart.";
}

function nextLevel(){

    if(level<10){

        level++;
        start();

    }
}

function restart(){
    start();
}

function goHome(){
    window.location.href="../index.html";
}

start();

</script>

</body>
</html>
