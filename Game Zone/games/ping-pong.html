<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ping Pong - GameZone</title>

<style>
body{
    margin:0;
    background:#111827;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    color:#38bdf8;
}

canvas{
    width:500px;
    height:600px;
    max-width:95%;
    background:#0f172a;
    border:3px solid #38bdf8;
    border-radius:10px;
}

.info{
    display:flex;
    justify-content:center;
    gap:30px;
    margin:15px;
    font-size:18px;
}

button{
    padding:10px 18px;
    margin:5px;
    border:0;
    border-radius:8px;
    background:#38bdf8;
    font-weight:bold;
    cursor:pointer;
}

#message{
    min-height:30px;
    font-size:19px;
}
</style>
</head>

<body>

<h1>🏓 Ping Pong</h1>

<div class="info">
    <div>Level: <b id="level">1</b></div>
    <div>You: <b id="playerScore">0</b></div>
    <div>Computer: <b id="computerScore">0</b></div>
</div>

<canvas id="canvas" width="500" height="600"></canvas>

<div id="message">
    Use ↑ ↓ keys to move your paddle.
</div>

<button onclick="restart()">🔄 Restart</button>
<button onclick="goHome()">🏠 Home</button>

<button
    id="nextBtn"
    onclick="nextLevel()"
    style="display:none"
>
▶ Next Level
</button>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let level=1;
let playerScore=0;
let computerScore=0;
let running=true;

let keys={};

const settings=[
    {speed:4,ai:2},
    {speed:4.3,ai:2.3},
    {speed:4.6,ai:2.6},
    {speed:4.9,ai:2.9},
    {speed:5.2,ai:3.2},
    {speed:5.5,ai:3.5},
    {speed:5.8,ai:3.8},
    {speed:6.1,ai:4.1},
    {speed:6.4,ai:4.4},
    {speed:6.8,ai:4.8}
];

const player={
    x:20,
    y:250,
    width:15,
    height:100
};

const computer={
    x:465,
    y:250,
    width:15,
    height:100
};

const ball={
    x:250,
    y:300,
    size:12,
    dx:4,
    dy:3
};

document.addEventListener("keydown",e=>{

    keys[e.key]=true;

    if(
        e.key==="ArrowUp"||
        e.key==="ArrowDown"
    ){
        e.preventDefault();
    }

});

document.addEventListener("keyup",e=>{
    keys[e.key]=false;
});

function resetBall(direction){

    ball.x=250;
    ball.y=300;

    const speed=settings[level-1].speed;

    ball.dx=direction*speed;

    ball.dy=
    (Math.random()>0.5?1:-1)*
    speed*0.65;
}

function start(){

    playerScore=0;
    computerScore=0;

    player.y=250;
    computer.y=250;

    running=true;

    document.getElementById("level")
    .textContent=level;

    document.getElementById("playerScore")
    .textContent=0;

    document.getElementById("computerScore")
    .textContent=0;

    document.getElementById("nextBtn")
    .style.display="none";

    document.getElementById("message")
    .textContent=
    "First player to reach 5 points wins!";

    resetBall(
        Math.random()>0.5?1:-1
    );

    requestAnimationFrame(loop);
}

function draw(){

    ctx.clearRect(
        0,0,canvas.width,canvas.height
    );

    // Middle line

    ctx.setLineDash([10,10]);

    ctx.strokeStyle="#64748b";

    ctx.beginPath();

    ctx.moveTo(250,0);
    ctx.lineTo(250,600);

    ctx.stroke();

    ctx.setLineDash([]);

    // Player

    ctx.fillStyle="#38bdf8";

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );

    // Computer

    ctx.fillStyle="#ef4444";

    ctx.fillRect(
        computer.x,
        computer.y,
        computer.width,
        computer.height
    );

    // Ball

    ctx.fillStyle="#facc15";

    ctx.fillRect(
        ball.x,
        ball.y,
        ball.size,
        ball.size
    );
}

function update(){

    const setting=settings[level-1];

    // Player

    if(keys["ArrowUp"])
        player.y-=7;

    if(keys["ArrowDown"])
        player.y+=7;

    player.y=Math.max(
        0,
        Math.min(
            canvas.height-player.height,
            player.y
        )
    );

    // Computer AI

    const computerCenter=
    computer.y+
    computer.height/2;

    const ballCenter=
    ball.y+
    ball.size/2;

    if(computerCenter<ballCenter)
        computer.y+=setting.ai;

    if(computerCenter>ballCenter)
        computer.y-=setting.ai;

    computer.y=Math.max(
        0,
        Math.min(
            canvas.height-computer.height,
            computer.y
        )
    );

    // Ball

    ball.x+=ball.dx;
    ball.y+=ball.dy;

    // Top/bottom

    if(
        ball.y<=0||
        ball.y+ball.size>=canvas.height
    ){

        ball.dy*=-1;
    }

    // Player collision

    if(
        ball.x<=player.x+player.width &&
        ball.x+ball.size>=player.x &&
        ball.y+ball.size>=player.y &&
        ball.y<=player.y+player.height &&
        ball.dx<0
    ){

        ball.dx=
        Math.abs(ball.dx);

        const hit=
        ball.y-
        (player.y+player.height/2);

        ball.dy=hit*0.08;
    }

    // Computer collision

    if(
        ball.x+ball.size>=computer.x &&
        ball.x<=computer.x+computer.width &&
        ball.y+ball.size>=computer.y &&
        ball.y<=computer.y+computer.height &&
        ball.dx>0
    ){

        ball.dx=
        -Math.abs(ball.dx);

        const hit=
        ball.y-
        (computer.y+computer.height/2);

        ball.dy=hit*0.08;
    }

    // Computer misses

    if(ball.x<0){

        computerScore++;

        document.getElementById("computerScore")
        .textContent=computerScore;

        checkWinner();

        if(running)
            resetBall(1);
    }

    // Player scores

    if(ball.x>canvas.width){

        playerScore++;

        document.getElementById("playerScore")
        .textContent=playerScore;

        checkWinner();

        if(running)
            resetBall(-1);
    }
}

function checkWinner(){

    if(playerScore>=5){

        running=false;

        document.getElementById("message")
        .textContent=
        "🏆 You won Level "+level+"!";

        if(level<10){

            document.getElementById("nextBtn")
            .style.display="inline-block";

        }else{

            document.getElementById("message")
            .textContent=
            "🎉 AMAZING! You completed all 10 levels!";
        }

    }

    else if(computerScore>=5){

        running=false;

        document.getElementById("message")
        .textContent=
        "❌ Computer won! Restart and try again.";
    }
}

function loop(){

    if(!running)return;

    update();
    draw();

    requestAnimationFrame(loop);
}

function nextLevel(){

    if(level<10){

        level++;

        start();
    }
}

function restart(){
    start();
}

function goHome(){
    window.location.href="../index.html";
}

start();

</script>

</body>
</html>
